<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>旅游英语 · 柬埔寨 7 天口语手册</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1c1c1a; --ink2:#5d5d58; --ink3:#8d8d86;
  --line:#e4e2dc; --line2:#d2cfc7; --green:#1D9E75; --green2:#0F6E56;
  --red:#A32D2D; --amber:#BA7517;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:72px;
}
/* ---------- 顶部 ---------- */
header.top{
  position:sticky;top:0;z-index:50;background:rgba(246,245,242,.97);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:9px 0 7px;
}
.trow{display:flex;align-items:center;gap:10px;padding:0 16px 7px}
.tname{font-size:13px;font-weight:600;letter-spacing:-.01em}
.tname span{color:var(--ink3);font-weight:400;margin-left:5px}
.chip{
  margin-left:auto;flex:0 0 auto;font-size:12px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;
  font-family:inherit;transition:.15s;
}
.chip.on{background:#8a2f4d;border-color:#8a2f4d;color:#fff}
.days{display:flex;gap:6px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.d{
  flex:0 0 auto;font-family:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;
  border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;transition:.15s;
}
.d.on{background:var(--ink);border-color:var(--ink);color:#fff}
.d.todo{opacity:.55}
/* ---------- 主体 ---------- */
main{max-width:720px;margin:0 auto;padding:0 16px}
.dhead{padding:22px 0 4px}
.dkicker{font-size:11px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
.dtitle{font-size:26px;line-height:1.3;margin:6px 0 4px;font-weight:600;letter-spacing:-.02em}
.dsub{font-size:13px;color:var(--ink2);margin:0;line-height:1.7}
.dstat{display:flex;gap:14px;font-size:12px;color:var(--ink3);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;margin-top:12px}
.dstat b{color:var(--ink);font-weight:600}
/* ---------- 场景块 ---------- */
.bh{display:flex;align-items:center;gap:9px;margin:26px 0 4px}
.bh .tm{font-size:11.5px;font-weight:600;color:#fff;background:var(--ink);padding:2px 7px;border-radius:4px;letter-spacing:.02em}
.bh .wh{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.bh .l{flex:1;height:1px;background:var(--line)}
.bnote{font-size:12px;color:var(--ink3);margin:6px 0 0;line-height:1.62}
ul.list{list-style:none;margin:8px 0 0;padding:0}
li.u{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--line2);border-radius:0 10px 10px 0;
  padding:10px 14px;margin:7px 0;
}
li.u.iv{border-left-color:#d49aae;background:#fdfafb}
.ue{font-size:15.5px;line-height:1.55;letter-spacing:-.005em;padding-right:38px}
.ue b{font-weight:600;text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:1.5px;text-underline-offset:3px}
.ui{font-family:"Charis SIL","Doulos SIL","Gentium Plus","Times New Roman",serif;font-size:12.5px;color:var(--green2);margin-top:3px;letter-spacing:.01em}
.uz{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.58}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px;font-weight:600;background:#e3f4ee;color:var(--green2)}
.tag.iv{background:#f7e4ea;color:#8a2f4d}
.spk{
  position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;
  border:1px solid var(--line2);background:#fff;color:#9a9a92;display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0;transition:.15s;
}
.spk:hover{border-color:var(--green);color:var(--green2)}
.spk.on{background:var(--green);border-color:var(--green);color:#fff}
/* ---------- 提示条 ---------- */
.note{border-left:3px solid var(--green);background:#f0f8f5;border-radius:0 10px 10px 0;padding:11px 14px;margin:10px 0;font-size:12.5px;color:#0b5344;line-height:1.64}
.note.warn{border-left-color:var(--amber);background:#fdf6e9;color:#633806}
.note b{font-weight:600}
/* ---------- 空状态 ---------- */
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:12px;padding:26px 20px;margin:22px 0;text-align:center}
.empty .e1{font-size:13.5px;font-weight:600;margin-bottom:6px}
.empty .e2{font-size:12.5px;color:var(--ink3);line-height:1.7}
/* ---------- 底部 ---------- */
.pbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);
  border:1px solid var(--line);border-radius:999px;padding:5px 7px;
  box-shadow:0 4px 16px rgba(0,0,0,.09);backdrop-filter:blur(8px);
}
.pb{font-family:inherit;font-size:12px;border:1px solid var(--line2);background:#fff;color:var(--ink2);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.pb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pcount{font-size:11.5px;color:var(--ink3);padding-right:8px;white-space:nowrap}
/* ---------- 今日必背 ---------- */
.must{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px 6px;margin:16px 0 6px}
.must h3{margin:0 0 3px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.must h3 .mk{font-size:10px;letter-spacing:.12em;color:#fff;background:var(--ink);border-radius:4px;padding:2px 6px;font-weight:600}
.must p.mp{margin:2px 0 8px;font-size:12px;color:var(--ink3);line-height:1.6}
.must ol{list-style:none;margin:0;padding:0;counter-reset:m}
.must li{counter-increment:m;position:relative;border-top:1px dashed var(--line);padding:9px 34px 9px 26px;margin:0}
.must li:before{content:counter(m);position:absolute;left:0;top:11px;width:17px;height:17px;border-radius:50%;background:#f0efe9;color:var(--ink2);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.must .ue{font-size:15px}
.must .uz{font-size:12px;color:var(--ink3);margin-top:2px}
.must li .ui{display:none}
.must li .spk{top:7px}
.must .endnote{font-size:11.5px;color:var(--ink3);border-top:1px dashed var(--line);margin-top:2px;padding:8px 0 8px;line-height:1.6}
/* ---------- 听力条目（对方说的） ---------- */
li.u.hear{border-left-color:#9aa8b5;background:#f8f9fa}
li.u.hear .tag{background:#eef0f2;color:#5d6b78}
.note.kh{border-left-color:#534AB7;background:#f3f2fb;color:#332e73}
/* ---------- 工具箱天 ---------- */
.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.tcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.tcell .th1{font-size:13.5px;font-weight:600;margin-bottom:3px}
.tcell .th2{font-size:12px;color:var(--ink3);line-height:1.6}
.khrow{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding:8px 2px}
.khrow .kw{font-size:15px;font-weight:600;white-space:nowrap}
.khrow .kr{font-family:"Charis SIL","Doulos SIL","Gentium Plus","Times New Roman",serif;font-size:12px;color:#534AB7;white-space:nowrap}
.khrow .kz{font-size:12.5px;color:var(--ink2);margin-left:auto;text-align:right}
.khrow .knote{font-size:11px;color:var(--ink3);width:100%;line-height:1.55;border-bottom:none}
</style>
</head>
<body>

<header class="top">
  <div class="trow">
    <div class="tname">柬埔寨 7 天<span>口语手册</span></div>
    <button class="chip" id="ivBtn" type="button">只看采访</button>
  </div>
  <div class="days" id="days"></div>
</header>

<main id="main"></main>

<div class="pbar">
  <button class="pb" id="slowBtn" type="button">慢速</button>
  <span class="pcount" id="pcount"></span>
</div>

<script src="audio-map.js"></script>

var curDay = 0, onlyIV = false;

/* ---------- 朗读 ---------- */
var ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.4 8.6a5 5 0 0 1 0 6.8"/></svg>';
var voices = [];
var currentAudio = null;
function loadVoices(){ try{ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }catch(e){ voices = []; } }
function pickVoice(){
  for(var i=0;i<voices.length;i++){ if(/en[-_]GB/i.test(voices[i].lang)) return voices[i]; }
  for(var k=0;k<voices.length;k++){ if(/^en/i.test(voices[k].lang)) return voices[k]; }
  return null;
}
function say(text, btn){
  if(currentAudio){ currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  var on = document.querySelectorAll('.spk.on');
  for(var i=0;i<on.length;i++) on[i].classList.remove('on');
  if(btn) btn.classList.add('on');
  var src = window.AUDIO && AUDIO[text];
  if(src){
    var audio = new Audio(src);
    currentAudio = audio;
    audio.playbackRate = document.body.classList.contains('slow') ? 0.75 : 1;
    var done = function(){ if(btn) btn.classList.remove('on'); if(currentAudio === audio) currentAudio = null; };
    audio.onended = done;
    audio.onerror = function(){ done(); fallbackSay(text, btn); };
    var started = audio.play();
    if(started && started.catch) started.catch(function(){ done(); fallbackSay(text, btn); });
    return;
  }
  fallbackSay(text, btn);
}
function fallbackSay(text, btn){
  if(!('speechSynthesis' in window)) return;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  u.rate = document.body.classList.contains('slow') ? 0.68 : 0.95;
  var v = pickVoice(); if(v) u.voice = v;
  var done = function(){ if(btn) btn.classList.remove('on'); };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}

/* ---------- 渲染 ---------- */
function esc(s){ return s; }

function renderDays(){
  var h = '';
  DAYS.forEach(function(o, i){
    var cls = 'd' + (i === curDay ? ' on' : '') + (!o.blocks.length && !o.tool ? ' todo' : '');
    var label = o.tool ? '工具箱' : o.d + ' ' + o.place;
    h += '<button class="' + cls + '" data-i="' + i + '" type="button">' + label + '</button>';
  });
  daysEl.innerHTML = h;
}

function countItems(day){
  var n = 0;
  day.blocks.forEach(function(b){
    b.items.forEach(function(it){ if(!onlyIV || it.iv) n++; });
  });
  return n;
}

function renderMain(){
  var day = DAYS[curDay];
  var total = countItems(day);
  var scenes = day.blocks.length;

  var h = '<div class="dhead">' +
    '<div class="dkicker">' + day.date + ' · ' + day.d + '</div>' +
    '<h1 class="dtitle">' + day.place + '　' + day.theme + '</h1>' +
    '<div class="dstat"><div>场景 <b>' + scenes + '</b></div><div>句子 <b>' + (day.tool ? '—' : total) + '</b></div>' +
    '<div>' + (onlyIV ? '已筛：只看采访' : (day.tool ? '工具页' : '按时间顺序')) + '</div></div></div>';

  if(day.tool){
    h += renderTool();
    mainEl.innerHTML = h;
    attachSpeakers();
    document.getElementById('pcount').textContent = '工具页';
    return;
  }

  if(!day.blocks.length){
    h += '<div class="empty"><div class="e1">这一天是空的</div>' +
      '<div class="e2">占位——内容在正式版里。</div></div>';
    mainEl.innerHTML = h;
    document.getElementById('pcount').textContent = '';
    return;
  }

  if(day.must){
    h += '<div class="must"><h3><span class="mk">今日必背</span>　六句，出发前过一遍</h3>';
    if(day.mustNote) h += '<p class="mp">' + day.mustNote + '</p>';
    h += '<ol>';
    day.must.forEach(function(m){
      h += '<li><div class="ue">' + m.en + '</div><div class="uz">' + m.zh + '</div></li>';
    });
    h += '</ol><div class="endnote">剩下的都是备查——到了现场再翻，不用提前背。</div></div>';
  }

  day.blocks.forEach(function(b){
    var items = b.items.filter(function(it){ return !onlyIV || it.iv; });
    if(!items.length) return;
    h += '<div class="bh"><span class="tm">' + b.t + '</span><span class="wh">' + b.w + '</span><span class="l"></span></div>';
    if(b.note && !(onlyIV && !b.iv)) h += '<div class="note' + (b.iv ? ' warn' : '') + '">' + b.note + '</div>';
    h += '<ul class="list">';
    items.forEach(function(it){
      h += '<li class="u' + (it.iv ? ' iv' : '') + '">' +
        '<div class="ue">' + it.en + '<span class="tag' + (it.iv ? ' iv' : '') + '">' + it.tag + '</span></div>' +
        '<div class="ui">' + it.ipa + '</div>' +
        '<div class="uz">' + it.zh + '</div>' +
        '</li>';
    });
    h += '</ul>';
  });

  mainEl.innerHTML = h;
  attachSpeakers();
  document.getElementById('pcount').textContent = total + ' 句';
}

function attachSpeakers(){
  var lis = mainEl.querySelectorAll('li.u, .must li');
  for(var i=0;i<lis.length;i++){
    (function(li){
      if(li.querySelector('.spk')) return;
      var ue = li.querySelector('.ue');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'spk'; b.setAttribute('aria-label', '朗读这一句');
      b.innerHTML = ICON;
      b.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var c = ue.cloneNode(true);
        var junk = c.querySelectorAll('.tag');
        for(var k=0;k<junk.length;k++) junk[k].parentNode.removeChild(junk[k]);
        say(c.textContent.replace(/\s+/g,' ').trim(), b);
      });
      li.appendChild(b);
    })(lis[i]);
  }
}

function go(i){
  curDay = i;
  renderDays();
  renderMain();
  window.scrollTo({top:0, behavior:'smooth'});
}

daysEl.addEventListener('click', function(e){
  var b = e.target.closest('.d');
  if(b) go(parseInt(b.dataset.i, 10));
});

var ivBtn = document.getElementById('ivBtn');
ivBtn.addEventListener('click', function(){
  onlyIV = !onlyIV;
  ivBtn.classList.toggle('on', onlyIV);
  ivBtn.textContent = onlyIV ? '只看采访 · 开' : '只看采访';
  renderMain();
});

var slowBtn = document.getElementById('slowBtn');
var slowOn = LS.get('kh-slow') === '1';
document.body.classList.toggle('slow', slowOn);
slowBtn.classList.toggle('on', slowOn);
slowBtn.addEventListener('click', function(){
  var on = !document.body.classList.contains('slow');
  document.body.classList.toggle('slow', on);
  slowBtn.classList.toggle('on', on);
  LS.set('kh-slow', on ? '1' : '0');
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    if(currentAudio){ currentAudio.pause(); currentAudio = null; }
    if(window.speechSynthesis) speechSynthesis.cancel();
    var on = document.querySelectorAll('.spk.on');
    for(var i=0;i<on.length;i++) on[i].classList.remove('on');
  }
});

renderDays();
renderMain();
loadVoices();
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
</script>
